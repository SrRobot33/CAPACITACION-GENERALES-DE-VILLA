<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Certificado Oficial | Generales de Villa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--panel:#181818;--border:#343434;--text:#f4f4f4;--muted:#9f9f9f;--gold:#c59a43}
body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#171717,#0b0b0b 360px);color:var(--text)}
.topbar{background:#111;border-bottom:1px solid var(--border)}
.topbar-in{width:min(1180px,100%);min-height:70px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;gap:12px;align-items:center}.mark{width:44px;height:44px;border:1px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-weight:900}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:3px}
.wrap{width:min(1180px,100%);margin:auto;padding:28px 20px 48px}.eyebrow{color:var(--gold);font-size:12px;font-weight:900;text-transform:uppercase}.lead{color:var(--muted);font-size:14px;margin:6px 0 18px}
.box{background:var(--panel);border:1px solid var(--border);border-radius:14px}.loading,.state{min-height:360px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px}.state{display:none}.cert{display:none}.summary{display:flex;justify-content:space-between;gap:16px;padding:16px 18px;margin-bottom:12px}.summary-title{font-weight:900}.summary-meta{font-size:13px;color:var(--muted);margin-top:4px}.score{font-size:26px;color:var(--gold);font-weight:900}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:8px;padding:10px 14px;font-size:12px;font-weight:900;cursor:pointer}.gold{background:var(--gold);color:#111}.outline{background:transparent;border:1px solid #484848;color:#eee}.viewer{height:min(80vh,1000px);min-height:650px;padding:6px;background:#101010}.viewer iframe{width:100%;height:100%;border:0;border-radius:8px;background:#fff}.note{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}@media(max-width:650px){.wrap{padding:20px 10px}.summary{flex-direction:column}.viewer{min-height:500px;height:70vh}.actions .btn{flex:1}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in"><div class="brand"><div class="mark">GV</div><div><strong>Generales de Villa</strong><span>Certificado Oficial</span></div></div><button id="topBack" class="btn outline">Volver a formatos</button></div></header>
<main class="wrap"><div class="eyebrow">Documento oficial interno</div><h1>Certificado original</h1><p class="lead">Formato institucional para expediente físico.</p>
<section id="loading" class="box loading">Preparando certificado...</section>
<section id="state" class="box state"><h2 id="stateTitle"></h2><p id="stateText"></p><button id="stateBack" class="btn gold">VOLVER</button></section>
<section id="cert" class="cert"><div class="box summary"><div><div id="courseTitle" class="summary-title"></div><div id="meta" class="summary-meta"></div></div><div id="score" class="score"></div></div><div class="actions"><button id="download" class="btn gold">DESCARGAR PDF</button><button id="print" class="btn outline">IMPRIMIR</button><button id="formats" class="btn outline">VOLVER A FORMATOS</button></div><div class="box viewer"><iframe id="preview"></iframe></div><div class="note">A4 vertical. La fecha de emisión y el pie quedan dentro del área imprimible.</div></section></main>
<script>
const EDGE="https://gjpzelljjuvcawdphdwf.supabase.co/functions/v1",DASH=`${EDGE}/employee-dashboard`,SESSION="gv_employee_session",EXPIRES="gv_employee_session_expires";const $=id=>document.getElementById(id);
const MOD_SIG="./assets/signature-modesto-v2.svg";const GAB_SIG="./assets/signature-gabriela-v2.svg";
function goFormats(){location.href='./certificate-options.html'}function logout(){localStorage.removeItem(SESSION);localStorage.removeItem(EXPIRES);location.href='./index.html'}function esc(v){return String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#039;')}function dateMX(v){if(!v)return'';const s=String(v),m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[3]}/${m[2]}/${m[1]}`;const d=new Date(v);return Number.isNaN(d.getTime())?'':new Intl.DateTimeFormat('es-MX',{day:'2-digit',month:'2-digit',year:'numeric',timeZone:'America/Chihuahua'}).format(d)}function score(v){const n=Number(v);if(!Number.isFinite(n))return'';return Number.isInteger(n)?String(n):n.toFixed(2)}function state(t,x){$('loading').style.display='none';$('cert').style.display='none';$('stateTitle').textContent=t;$('stateText').textContent=x;$('state').style.display='flex'}
function certificateHTML(employee,course,cert){const fullName=esc(employee.full_name||'');return `<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><base href="${location.href}"><style>@page{size:A4 portrait;margin:0}*{box-sizing:border-box}html,body{margin:0;padding:0;background:#fff;font-family:Arial,Helvetica,sans-serif;color:#242424}.sheet{position:relative;width:210mm;height:297mm;padding:11mm 16mm 12mm;overflow:hidden;background:#fff}.watermark{position:absolute;left:50%;top:51%;width:108mm;height:108mm;transform:translate(-50%,-50%);opacity:.05;object-fit:contain}.seal{position:absolute;right:5mm;top:4mm;width:18mm;height:18mm;object-fit:contain}.content{position:relative;z-index:1}.head{text-align:center}.restaurant{font-size:6mm;font-weight:800}.city{font-size:3.1mm;font-style:italic;color:#666;margin-top:1mm}.title{font-size:7.5mm;font-weight:900;color:#b8860b;margin-top:6mm}.course{font-size:4mm;margin-top:1.5mm}.grant{font-size:3.7mm;font-style:italic;margin-top:5mm}.section{margin-top:4.5mm}.section-title{font-size:3.6mm;font-weight:900;color:#b8860b;border-bottom:.3mm solid #b8860b;padding-bottom:1.5mm;margin-bottom:2.2mm}.row{display:flex;gap:2mm;align-items:flex-end;margin:1.8mm 0;font-size:3.15mm}.label{font-weight:700;white-space:nowrap}.line{border-bottom:.2mm solid #999;min-height:4.2mm;padding:0 1mm .5mm;flex:1}.line.value{font-weight:900}.program{font-size:3.05mm;line-height:1.28}.program small{font-size:2.2mm;color:#666;font-style:italic}.dates{display:grid;grid-template-columns:1fr 1fr;gap:9mm;margin-top:1.8mm}.norm{font-size:2.25mm;line-height:1.3;color:#555}.score-block{text-align:center;margin-top:3.5mm}.score-title{font-size:3.6mm;font-weight:900;color:#b8860b}.score-value{font-size:6mm;font-weight:900;margin-top:.8mm}.score-note{font-size:1.95mm;color:#777;font-style:italic;margin-top:.8mm}.sig-area{display:grid;grid-template-columns:1fr 1fr 1fr;gap:5mm;margin-top:3.5mm;padding-top:3.5mm}.sig{text-align:center;min-width:0}.sig-img{height:11mm;width:100%;object-fit:contain;display:block;margin:0 auto}.sig-blank{height:11mm}.sig-line{border-top:.22mm solid #222;padding-top:1.1mm;font-size:2.5mm;font-weight:700}.sig-name{font-size:2.15mm;font-weight:700;margin-top:.6mm;line-height:1.15}.sig-pos{font-size:2.05mm;color:#555;margin-top:.35mm}.issued{text-align:center;font-size:2.6mm;margin-top:2.7mm}.folio{position:absolute;right:16mm;bottom:10mm;font-size:2mm;color:#777}.footer{position:absolute;left:16mm;right:16mm;bottom:4mm;border-top:.15mm solid #bbb;padding-top:1.4mm;text-align:center;font-size:1.8mm;color:#777;font-style:italic;line-height:1.2}@media print{html,body,.sheet{width:210mm;height:297mm}.sheet{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><div class="sheet"><img class="watermark" src="./assets/certificate-watermark.webp"><img class="seal" src="./assets/certificate-seal.webp"><div class="content"><div class="head"><div class="restaurant">RESTAURANTE GENERALES DE VILLA</div><div class="city">Juárez, México</div><div class="title">CERTIFICADO DE CAPACITACIÓN INTERNA</div><div class="course">${esc(course.title||'Manejo Higiénico y Seguridad Alimentaria')}</div><div class="grant">Se otorga la presente constancia a:</div></div><div class="section"><div class="section-title">DATOS DEL TRABAJADOR</div><div class="row"><span class="label">Nombre completo:</span><span class="line value">${fullName}</span></div><div class="row"><span class="label">Puesto:</span><span class="line">${esc(employee.position||'')}</span></div><div class="row"><span class="label">Área:</span><span class="line">${esc(employee.area||'')}</span></div><div class="row"><span class="label">Fecha de ingreso:</span><span class="line">${dateMX(employee.hire_date)}</span></div></div><div class="section"><div class="section-title">DATOS DE LA CAPACITACIÓN</div><div class="program">Capacitación interna en Manejo Higiénico y Seguridad Alimentaria<br><small>Programa completo — Módulos 1 al 4 (Marco Legal y Riesgos · Recepción y Almacenamiento · Manejo Térmico · Sanitización y Registros)</small></div><div class="dates"><div class="row"><span class="label">Fecha de inicio:</span><span class="line">${dateMX(cert.course_start_date)}</span></div><div class="row"><span class="label">Fecha de conclusión:</span><span class="line">${dateMX(cert.course_completion_date)}</span></div></div></div><div class="section"><div class="section-title">FUNDAMENTO NORMATIVO</div><div class="norm"><div>• NOM-251-SSA1-2009 — Prácticas de higiene para el proceso de alimentos, bebidas o suplementos alimenticios.</div><div>• Criterios de verificación sanitaria COFEPRIS / COESPRIS Chihuahua.</div><div>• NMX-F-605-NORMEX — Estándares del Distintivo H.</div></div></div><div class="score-block"><div class="score-title">CALIFICACIÓN OBTENIDA</div><div class="score-value">${score(cert.final_score)} / 100</div><div class="score-note">Mínimo aprobatorio para acreditar el programa: 80/100. Esta constancia solo se emite al concluir la totalidad de los Módulos 1 al 4.</div></div><div class="sig-area"><div class="sig"><img class="sig-img" src="${GAB_SIG}"><div class="sig-line">Firma del Instructor</div><div class="sig-name">Gabriela Lorena Vazquez Villalobos</div><div class="sig-pos">Chef Ejecutiva · Instructora</div></div><div class="sig"><img class="sig-img" src="${MOD_SIG}"><div class="sig-line">Firma del Instructor</div><div class="sig-name">Modesto Isaac Moreno Garcia</div><div class="sig-pos">Sous-chef · Instructor</div></div><div class="sig"><div class="sig-blank"></div><div class="sig-line">Firma del Trabajador</div></div></div><div class="issued">Fecha de emisión: <strong>${dateMX(cert.issued_at)}</strong></div></div><div class="folio">Folio: ${esc(cert.certificate_number||'')}</div><div class="footer">Este documento forma parte del expediente de capacitación interna del trabajador y podrá ser solicitado como evidencia documental durante una verificación sanitaria de COFEPRIS/COESPRIS.</div></div></body></html>`}
function printCertificate(){try{$('preview').contentWindow.focus();$('preview').contentWindow.print()}catch(e){state('No fue posible abrir la impresión',String(e?.message||e))}}
function loadScript(src){return new Promise((ok,fail)=>{if(document.querySelector(`script[src="${src}"]`)){ok();return}const s=document.createElement('script');s.src=src;s.onload=ok;s.onerror=fail;document.head.appendChild(s)})}
function pngData(src){return new Promise((resolve,reject)=>{const im=new Image();im.crossOrigin='anonymous';im.onload=()=>{try{const c=document.createElement('canvas');c.width=im.naturalWidth||1200;c.height=im.naturalHeight||600;c.getContext('2d').drawImage(im,0,0,c.width,c.height);resolve(c.toDataURL('image/png'))}catch(e){reject(e)}};im.onerror=reject;im.src=src})}
async function embedPdfImages(doc){const changed=[];for(const img of [...doc.images]){const original=img.getAttribute('src');if(!original||original.startsWith('data:'))continue;try{const data=await pngData(img.currentSrc||img.src);changed.push([img,original]);img.src=data;await new Promise(r=>{if(img.complete)r();else img.onload=img.onerror=r})}catch(e){console.warn('No se pudo incrustar imagen',original,e)}}return()=>changed.forEach(([img,src])=>img.setAttribute('src',src))}
async function downloadCertificate(){const b=$('download'),old=b.textContent;let restore=()=>{};try{b.disabled=true;b.textContent='GENERANDO PDF...';await loadScript('https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js');await loadScript('https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js');const f=$('preview'),doc=f.contentDocument||f.contentWindow.document,el=doc.querySelector('.sheet');if(!el)throw new Error('Certificado no disponible');if(doc.fonts?.ready)await doc.fonts.ready;await Promise.all([...doc.images].map(i=>i.complete?Promise.resolve():new Promise(r=>{i.onload=i.onerror=r})));restore=await embedPdfImages(doc);const canvas=await html2canvas(el,{scale:2,useCORS:true,backgroundColor:'#ffffff',logging:false});const {jsPDF}=window.jspdf,pdf=new jsPDF({orientation:'portrait',unit:'mm',format:'a4',compress:true});pdf.addImage(canvas.toDataURL('image/jpeg',.96),'JPEG',0,0,210,297);const folio=($('meta').textContent.match(/Folio:\s*([^\s·]+)/)||[])[1]||'certificado';pdf.save(`Certificado-${folio}.pdf`)}catch(e){console.error(e);alert('No fue posible descargar el PDF. Intenta nuevamente.')}finally{restore();b.disabled=false;b.textContent=old}}
async function load(){const token=localStorage.getItem(SESSION);if(!token){location.href='./index.html';return}try{const r=await fetch(DASH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_token:token})}),d=await r.json();if(r.status===401||d.authenticated===false){logout();return}if(!r.ok||d.success!==true)throw new Error(d.message||'Error al consultar el certificado');const c=d.certificate;if(!c||String(c.status||'').toLowerCase()!=='issued'){state('Certificado aún no disponible','Se habilitará automáticamente al completar y aprobar la capacitación.');return}const e=d.employee||{},course=d.course||{};$('courseTitle').textContent=course.title||'Manejo Higiénico y Seguridad Alimentaria';$('score').textContent=`${score(c.final_score)} / 100`;$('meta').textContent=[c.certificate_number?`Folio: ${c.certificate_number}`:'',c.course_completion_date?`Conclusión: ${dateMX(c.course_completion_date)}`:''].filter(Boolean).join(' · ');$('preview').srcdoc=certificateHTML(e,course,c);$('loading').style.display='none';$('cert').style.display='block'}catch(e){console.error(e);state('No fue posible preparar el certificado',String(e?.message||e))}}$('topBack').onclick=goFormats;$('stateBack').onclick=goFormats;$('formats').onclick=goFormats;$('download').onclick=downloadCertificate;$('print').onclick=printCertificate;load();
</script></body></html>
