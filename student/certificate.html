<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link rel="icon" type="image/svg+xml" href="./favicon.svg">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Certificado Oficial | Generales de Villa</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}:root{--gold:#b8860b;--panel:#181818;--border:#343434;--text:#f4f4f4;--muted:#9f9f9f}body{min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#171717,#0b0b0b 360px);color:var(--text)}.topbar{background:#101010;border-bottom:1px solid var(--border)}.topbar-in{width:min(1180px,100%);min-height:72px;margin:auto;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{display:flex;align-items:center;gap:12px}.mark{width:46px;height:46px;border:1.5px solid var(--gold);border-radius:50%;display:grid;place-items:center;color:var(--gold);font-weight:900}.brand strong{display:block}.brand span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.wrap{width:min(1180px,100%);margin:auto;padding:28px 18px 50px}.eyebrow{color:var(--gold);font-size:12px;font-weight:900;letter-spacing:.8px;margin-bottom:7px}h1{font-size:32px;margin-bottom:7px}.lead{color:var(--muted);font-size:14px;margin-bottom:18px}.box{background:var(--panel);border:1px solid var(--border);border-radius:16px}.loading,.state{min-height:430px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:28px}.state{display:none}.spinner{width:42px;height:42px;border:4px solid #303030;border-top-color:var(--gold);border-radius:50%;animation:spin .8s linear infinite;margin-bottom:16px}@keyframes spin{to{transform:rotate(360deg)}}.cert{display:none}.summary{display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 18px;margin-bottom:12px}.summary-title{font-weight:900}.summary-meta{font-size:13px;color:var(--muted);margin-top:5px}.score{font-size:26px;color:var(--gold);font-weight:900}.actions{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}.btn{border:0;border-radius:9px;padding:11px 15px;font-size:12px;font-weight:900;cursor:pointer}.gold{background:var(--gold);color:#111}.outline{background:transparent;border:1px solid #484848;color:#eee}.viewer{height:min(82vh,1050px);min-height:650px;padding:8px;background:#101010}.viewer iframe{width:100%;height:100%;border:0;border-radius:10px;background:#fff}.note{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}@media(max-width:650px){.topbar-in{padding:10px 12px}.brand span{display:none}.wrap{padding:20px 10px 35px}.summary{flex-direction:column;align-items:flex-start}.viewer{height:70vh;min-height:500px}.actions .btn{flex:1}}
</style>
</head>
<body>
<header class="topbar"><div class="topbar-in"><div class="brand"><div class="mark">GV</div><div><strong>Generales de Villa</strong><span>Certificado Oficial</span></div></div><button id="topBack" class="btn outline">Volver a formatos</button></div></header>
<main class="wrap"><div class="eyebrow">DOCUMENTO OFICIAL INTERNO</div><h1>Certificado original</h1><p class="lead">Formato institucional discreto para expediente físico.</p>
<section id="loading" class="box loading"><div class="spinner"></div><div>Preparando certificado...</div></section>
<section id="state" class="box state"><h2 id="stateTitle">Certificado no disponible</h2><p id="stateText"></p><button id="stateBack" class="btn gold">VOLVER</button></section>
<section id="cert" class="cert"><div class="box summary"><div><div id="courseTitle" class="summary-title"></div><div id="meta" class="summary-meta"></div></div><div id="score" class="score"></div></div><div class="actions"><button id="download" class="btn gold">DESCARGAR / GUARDAR PDF</button><button id="print" class="btn outline">IMPRIMIR</button><button id="formats" class="btn outline">VOLVER A FORMATOS</button></div><div class="box viewer"><iframe id="preview"></iframe></div><div class="note">Formato A4 vertical basado en la plantilla original.</div></section></main>
<script>
const EDGE="https://gjpzelljjuvcawdphdwf.supabase.co/functions/v1",DASH=`${EDGE}/employee-dashboard`,SESSION="gv_employee_session";const $=id=>document.getElementById(id);const A=new URL("./assets/",location.href).href;function goFormats(){location.href="./certificate-options.html"}function logout(){localStorage.removeItem(SESSION);location.href="./index.html"}function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;")}function dateMX(v){if(!v)return"";const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})/);if(m)return`${m[3]}/${m[2]}/${m[1]}`;const d=new Date(v);return Number.isNaN(d.getTime())?"":new Intl.DateTimeFormat("es-MX",{day:"2-digit",month:"2-digit",year:"numeric",timeZone:"America/Chihuahua"}).format(d)}function score(v){const n=Number(v);return Number.isFinite(n)?(Number.isInteger(n)?String(n):n.toFixed(2)):""}function state(t,x){$("loading").style.display="none";$("cert").style.display="none";$("stateTitle").textContent=t;$("stateText").textContent=x;$("state").style.display="flex"}
function html(e,c,cert){return `<!DOCTYPE html><html><head><meta charset="UTF-8"><base href="${A}"><style>@page{size:A4 portrait;margin:0}*{box-sizing:border-box}html,body{margin:0;background:white;font-family:Arial,Helvetica,sans-serif;color:#252525}.sheet{width:210mm;height:297mm;position:relative;padding:22mm 17mm 13mm;overflow:hidden;background:#fff}.seal{position:absolute;right:5mm;top:2mm;width:19mm;height:19mm;object-fit:contain}.water{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%);width:92mm;height:92mm;object-fit:contain;opacity:.08}.content{position:relative;z-index:1}.head{text-align:center}.restaurant{font-size:5.6mm;font-weight:900}.city{font-size:3mm;color:#666;font-style:italic;margin-top:1mm}.title{font-size:7.2mm;font-weight:900;color:#b8860b;margin-top:10mm}.course{font-size:4.1mm;margin-top:2mm}.grant{font-size:3.8mm;font-style:italic;margin-top:10mm}.section{margin-top:10mm}.st{font-size:4mm;font-weight:900;color:#b8860b;border-bottom:.35mm solid #b8860b;padding-bottom:2.5mm;margin-bottom:4mm}.row{display:flex;align-items:flex-end;gap:2mm;font-size:3.55mm;margin:3mm 0}.lab{font-weight:900;white-space:nowrap}.line{border-bottom:.22mm solid #999;min-height:5mm;flex:1;padding:0 1mm .8mm}.nameval{font-weight:900}.program{font-size:3.4mm;line-height:1.4}.program small{font-size:2.45mm;color:#666;font-style:italic}.dates{display:grid;grid-template-columns:1fr 1fr;gap:12mm;margin-top:4mm}.norm{font-size:2.5mm;line-height:1.45;color:#555}.scorebox{text-align:center;margin-top:8mm}.scoretitle{font-size:3.8mm;color:#b8860b;font-weight:900}.scoreval{font-size:7mm;font-weight:900;margin-top:2mm}.scorenote{font-size:2.2mm;color:#777;font-style:italic;margin-top:1.5mm}.sigarea{display:grid;grid-template-columns:1fr 1fr;gap:30mm;margin-top:11mm;border-top:.3mm solid #222;padding-top:8mm}.sig{text-align:center}.sigimg{height:18mm;width:100%;object-fit:contain;display:block;filter:contrast(2.8) brightness(1.6);mix-blend-mode:multiply}.blank{height:18mm}.sigline{border-top:.28mm solid #222;padding-top:2mm;font-size:2.9mm;font-weight:900}.signame{font-size:2.6mm;margin-top:1mm}.sigpos{font-size:2.45mm;color:#555;margin-top:.5mm}.issued{text-align:center;font-size:3mm;margin-top:7mm}.folio{position:absolute;right:17mm;bottom:18mm;font-size:2.2mm;color:#777}.footer{position:absolute;left:17mm;right:17mm;bottom:8mm;border-top:.18mm solid #bbb;padding-top:2.2mm;text-align:center;font-size:2.05mm;color:#777;font-style:italic;line-height:1.3}@media print{.sheet{print-color-adjust:exact;-webkit-print-color-adjust:exact}}</style></head><body><div class="sheet"><img class="seal" src="certificate-seal.webp"><img class="water" src="certificate-watermark.webp"><div class="content"><div class="head"><div class="restaurant">RESTAURANTE GENERALES DE VILLA</div><div class="city">Juárez, México</div><div class="title">CERTIFICADO DE CAPACITACIÓN INTERNA</div><div class="course">${esc(c.title||"Manejo Higiénico y Seguridad Alimentaria")}</div><div class="grant">Se otorga la presente constancia a:</div></div><div class="section"><div class="st">DATOS DEL TRABAJADOR</div><div class="row"><span class="lab">Nombre completo:</span><span class="line nameval">${esc(e.full_name)}</span></div><div class="row"><span class="lab">Puesto:</span><span class="line">${esc(e.position)}</span></div><div class="row"><span class="lab">Área:</span><span class="line">${esc(e.area)}</span></div><div class="row"><span class="lab">Fecha de ingreso:</span><span class="line">${dateMX(e.hire_date)}</span></div></div><div class="section"><div class="st">DATOS DE LA CAPACITACIÓN</div><div class="program">Capacitación interna en Manejo Higiénico y Seguridad Alimentaria<br><small>Programa completo — Módulos 1 al 4 (Marco Legal y Riesgos · Recepción y Almacenamiento · Manejo Térmico · Sanitización y Registros)</small></div><div class="dates"><div class="row"><span class="lab">Fecha de inicio:</span><span class="line">${dateMX(cert.course_start_date)}</span></div><div class="row"><span class="lab">Fecha de conclusión:</span><span class="line">${dateMX(cert.course_completion_date)}</span></div></div></div><div class="section"><div class="st">FUNDAMENTO NORMATIVO</div><div class="norm">• NOM-251-SSA1-2009 — Prácticas de higiene para el proceso de alimentos, bebidas o suplementos alimenticios.<br>• Criterios de verificación sanitaria COFEPRIS / COESPRIS Chihuahua.<br>• NMX-F-605-NORMEX — Estándares del Distintivo H.</div></div><div class="scorebox"><div class="scoretitle">CALIFICACIÓN OBTENIDA</div><div class="scoreval">${score(cert.final_score)} / 100</div><div class="scorenote">Mínimo aprobatorio para acreditar el programa: 80/100. Esta constancia solo se emite al concluir la totalidad de los Módulos 1 al 4.</div></div><div class="sigarea"><div class="sig"><img class="sigimg" src="signature-gabriela.jpg"><div class="sigline">Firma del Instructor</div><div class="signame">Gabriela Lorena Vazquez Villalobos</div><div class="sigpos">Chef Ejecutiva · Instructora</div></div><div class="sig"><div class="blank"></div><div class="sigline">Firma del Trabajador</div><div class="signame">${esc(e.full_name)}</div><div class="sigpos">${esc(e.position)}</div></div></div><div class="issued">Fecha de emisión: <strong>${dateMX(cert.issued_at)}</strong></div></div><div class="folio">Folio: ${esc(cert.certificate_number||"")}</div><div class="footer">Este documento forma parte del expediente de capacitación interna del trabajador y podrá ser solicitado como evidencia documental durante una verificación sanitaria de COFEPRIS/COESPRIS.</div></div></body></html>`}function printCert(){try{$("preview").contentWindow.focus();$("preview").contentWindow.print()}catch(e){state("No fue posible imprimir",String(e?.message||e))}}async function load(){const token=localStorage.getItem(SESSION);if(!token){location.href="./index.html";return}try{const r=await fetch(DASH,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({session_token:token})}),d=await r.json();if(r.status===401||d.authenticated===false){logout();return}if(!r.ok||d.success!==true)throw new Error(d.message||"Error");const cert=d.certificate;if(!cert||String(cert.status||"").toLowerCase()!=="issued"){state("Certificado aún no disponible","Se habilitará al concluir la capacitación.");return}const e=d.employee||{},c=d.course||{};$("courseTitle").textContent=c.title||"Manejo Higiénico y Seguridad Alimentaria";$("score").textContent=`${score(cert.final_score)} / 100`;$("meta").textContent=`Folio: ${cert.certificate_number||""} · Conclusión: ${dateMX(cert.course_completion_date)}`;$("preview").srcdoc=html(e,c,cert);$("loading").style.display="none";$("cert").style.display="block"}catch(e){console.error(e);state("No fue posible preparar el certificado",String(e?.message||e))}}$("topBack").onclick=goFormats;$("stateBack").onclick=goFormats;$("formats").onclick=goFormats;$("download").onclick=printCert;$("print").onclick=printCert;load();
</script>
</body></html>
