function printCertificate(){try{$('preview').contentWindow.focus();$('preview').contentWindow.print()}catch(e){state('No fue posible abrir la impresión',String(e?.message||e))}}async function load(){const token=localStorage.getItem(SESSION);if(!token){location.href='./index.html';return}try{const r=await fetch(DASH,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({session_token:token})}),d=await r.json();if(r.status===401||d.authenticated===false){logout();return}if(!r.ok||d.success!==true)throw new Error(d.message||'Error al consultar el certificado');const c=d.certificate;if(!c||String(c.status||'').toLowerCase()!=='issued'){state('Certificado aún no disponible','Se habilitará automáticamente al completar y aprobar la capacitación.');return}const e=d.employee||{},course=d.course||{};$('courseTitle').textContent=course.title||'Manejo Higiénico y Seguridad Alimentaria';$('score').textContent=`${score(c.final_score)} / 100`;$('meta').textContent=[c.certificate_number?`Folio: ${c.certificate_number}`:'',c.course_completion_date?`Conclusión: ${dateMX(c.course_completion_date)}`:''].filter(Boolean).join(' · ');$('preview').srcdoc=certificateHTML(e,course,c);$('loading').style.display='none';$('cert').style.display='block'}catch(e){console.error(e);state('No fue posible preparar el certificado',String(e?.message||e))}}$('topBack').onclick=goFormats;$('stateBack').onclick=goFormats;$('formats').onclick=goFormats;$('download').onclick=printCertificate;$('print').onclick=printCertificate;load();
